# Mosquitto MQTT Broker config

listener 1883
listener 9001
protocol websockets

# ── Auth ──────────────────────────────────────────────────────────────────────
# ถ้าอยากใส่ password ให้เปลี่ยน allow_anonymous false
# แล้วรัน: docker exec iot208-mosquitto mosquitto_passwd -c /mosquitto/config/passwd <username>
allow_anonymous true
# password_file /mosquitto/config/passwd

# ── Persistence ───────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
